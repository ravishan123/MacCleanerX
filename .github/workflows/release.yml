name: Release

# Push a tag like v1.2.0 to test, build the universal .dmg and publish it on
# GitHub Releases. If the release already exists (for example one created by
# hand), the .dmg and checksum are replaced with the CI-built ones.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: swift test --package-path Packages/CleanerCore

      - name: Build .dmg
        run: scripts/make-dmg.sh "${TAG#v}"

      - name: Publish
        run: |
          VERSION="${TAG#v}"
          DMG="build/MacCleaner-$VERSION.dmg"
          # Release notes: banner, this version's section of the changelog, install steps.
          cat docs/release-header.md > notes.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md >> notes.md
          cat docs/release-footer.md >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          else
            gh release create "$TAG" "$DMG" "$DMG.sha256" \
              --title "Mac Cleaner $VERSION" --notes-file notes.md
          fi
