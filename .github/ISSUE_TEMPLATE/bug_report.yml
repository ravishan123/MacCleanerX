name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **If Mac Cleaner removed (or could remove) something it shouldn't, please use [private security reporting](https://github.com/ravishan123/MacCleanerX/security/advisories/new) instead.**
  - type: input
    id: version
    attributes:
      label: Mac Cleaner version
      description: Settings → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.1, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Activity log or screenshots
      description: Relevant lines from Settings → Activity, if the bug involves cleaning. Remove personal file names if you prefer.
  - type: checkboxes
    id: fda
    attributes:
      label: Full Disk Access
      options:
        - label: Mac Cleaner has Full Disk Access
